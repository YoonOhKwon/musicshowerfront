  <meta name="theme-color" content="#08080e">
  <link rel="icon" href="data:,">
  <title>Music Shower · Real-time Music Language</title>
  <link rel="stylesheet" href="./style.css">

<body>
  <main id="audioLauncher" class="launcher" aria-labelledby="appTitle">
    <p class="eyebrow">REAL-TIME MUSIC LANGUAGE VISUALIZER</p>
    <h1 id="appTitle">MUSIC SHOWER</h1>
    <p class="description">
      음악을 로컬에서 즉시 느끼고 의미 상태로 융합해<br>
      장르·악기·리듬·연주·음악적 맥락을 명료한 단어로 보여줍니다.
    </p>
    <label class="qualityControl" for="qualityMode">
      <span>분석 품질</span>
      <select id="qualityMode" aria-label="음악 분석 품질">
        <option value="performance">가볍게</option>
        <option value="balanced">균형</option>
        <option value="quality">정밀</option>
      </select>
    </label>
    <label class="qualityControl" for="languageMode">
      <span>문구 생성</span>
      <select id="languageMode" aria-label="문구 생성 방식">
        <option value="remote">실시간 분석 + AI 해석 · API 사용</option>
        <option value="local">실시간 분석 · 비용 없음</option>
      </select>
    </label>
    <div class="actions">
      <button id="startButton" class="primaryButton">탭·시스템 오디오</button>
      <button id="fileButton" class="secondaryButton">음원 파일 선택</button>
    </div>
    <p class="hint">탭 오디오를 선택할 때 ‘오디오 공유’를 켜 주세요.</p>
    <p class="hint">생성형 모드는 오디오 대신 분석 요약만 전송합니다. L: 프롬프트·토큰 추적</p>
    <input id="audioFileInput" type="file" accept="audio/*" hidden>
  </main>

  <p id="audioStatus" class="audioStatus" data-state="info" aria-live="polite">
    입력 방식을 선택하세요.
  </p>
  <button id="stopButton" class="stopButton" hidden>분석 중지</button>
